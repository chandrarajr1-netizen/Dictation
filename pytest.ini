[pytest]
# Lets the tests import "main", "controller" and "service" from BackEnd.
pythonpath = BackEnd
testpaths = Tests/controller_tests Tests/service_tests
filterwarnings = ignore::UserWarning

# Tests marked "claude" call the real Claude API (costs money), so they are
# skipped by default. Run them with:  pytest -m claude
markers =
    claude: calls the real Claude API
addopts = -m "not claude"
